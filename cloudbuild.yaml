substitutions:
  _REGION: asia-northeast3
  _SERVICE_NAME: reservation-api
  _ARTIFACT_REPOSITORY: reservation-api
  _CLOUD_SQL_CONNECTION_NAME: reservation-io:asia-northeast3:reservation-db-lite
  _RUNTIME_SERVICE_ACCOUNT: reservation-api-runner@reservation-io.iam.gserviceaccount.com
  _IS_DEV_MODE: "false"
  _APP_ENV: production
  _APP_TIMEZONE: Asia/Seoul
  _DISPLAY_TIMEZONE_LABEL: Seoul, KR
  _CORS_ALLOWED_ORIGINS: https://reservation-io.vercel.app
  _OTP_TIMEOUT_SECOND: "30"
  _OTP_DELTA: "1"
  _OTP_QR_HASH_ALGORITHM: md5
  _OTP_MANUAL_HASH_ALGORITHM: sha1
  _OTP_MANUAL_CODE_LENGTH: "12"
  _OTP_MANUAL_CODE_REGISTRY_BACKEND: firestore
  _OTP_MANUAL_CODE_COLLECTION: manual_otp_codes
  _OTP_MANUAL_CODE_MAX_ATTEMPTS: "16"
  _FIRESTORE_PROJECT_ID: reservation-io
  _FIRESTORE_DATABASE: "(default)"
  _MESSAGE_BUS_BACKEND: none
  _VISIT_EVENT_TOPIC: ""
  _RESERVATION_QUEUE_BACKEND: cloud_tasks
  _CLOUD_TASKS_PROJECT_ID: reservation-io
  _CLOUD_TASKS_LOCATION: asia-northeast3
  _CLOUD_TASKS_QUEUE: reservation-requests
  _RESERVATION_WORKER_URL: "https://reservation-api-881902730598.asia-northeast3.run.app/internal/reservation-worker"
  _CLOUD_TASKS_SERVICE_ACCOUNT_EMAIL: reservation-api-runner@reservation-io.iam.gserviceaccount.com
  _CLOUD_TASKS_AUDIENCE: ""
  _DATABASE_URL_SECRET: reservation-database-url
  _SECRET_KEY_SECRET: reservation-secret-key
  _OTP_SECRET_KEY_SECRET: reservation-otp-secret-key
  _ADMIN_ID_SECRET: reservation-admin-id
  _ADMIN_PASSWORD_SECRET: reservation-admin-password
  _KAKAO_REST_API_KEY_SECRET: reservation-kakao-rest-api-key
  _KAKAO_CLIENT_SECRET_SECRET: reservation-kakao-client-secret
  _KAKAO_REDIRECT_URI_ALLOWLIST: https://reservation-io.vercel.app/oauth/kakao/callback
  _RESERVATION_GATEWAY_SECRET_SECRET: reservation-gateway-secret
  _RESERVATION_WORKER_SECRET_SECRET: reservation-worker-secret
  _ADMIN_LOGIN_GATEWAY_REQUIRED: "false"
  _CLEANUP_GMT_9_HOUR: "4"
  _RUN_MIGRATIONS: "true"

steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REPOSITORY}/${_SERVICE_NAME}:$SHORT_SHA
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REPOSITORY}/${_SERVICE_NAME}:latest
      - .

  - name: gcr.io/cloud-builders/docker
    args:
      - push
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REPOSITORY}/${_SERVICE_NAME}:$SHORT_SHA

  - name: gcr.io/cloud-builders/docker
    args:
      - push
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REPOSITORY}/${_SERVICE_NAME}:latest

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args:
      - run
      - jobs
      - deploy
      - ${_SERVICE_NAME}-migrate
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REPOSITORY}/${_SERVICE_NAME}:$SHORT_SHA
      - --region=${_REGION}
      - --service-account=${_RUNTIME_SERVICE_ACCOUNT}
      - --set-cloudsql-instances=${_CLOUD_SQL_CONNECTION_NAME}
      - --command=alembic
      - --args=upgrade,head
      - --set-env-vars=^|^IS_DEV_MODE=${_IS_DEV_MODE}|APP_ENV=${_APP_ENV}|APP_TIMEZONE=${_APP_TIMEZONE}|MESSAGE_BUS_BACKEND=none
      - --set-secrets=DATABASE_URL=${_DATABASE_URL_SECRET}:latest,SECRET_KEY=${_SECRET_KEY_SECRET}:latest,OTP_SECRET_KEY=${_OTP_SECRET_KEY_SECRET}:latest,ADMIN_ID=${_ADMIN_ID_SECRET}:latest,ADMIN_PASSWORD=${_ADMIN_PASSWORD_SECRET}:latest,KAKAO_REST_API_KEY=${_KAKAO_REST_API_KEY_SECRET}:latest,KAKAO_CLIENT_SECRET=${_KAKAO_CLIENT_SECRET_SECRET}:latest

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: bash
    args:
      - -c
      - |
        if [ "${_RUN_MIGRATIONS}" = "true" ]; then
          gcloud run jobs execute ${_SERVICE_NAME}-migrate --region=${_REGION} --wait
        else
          echo "Skipping migration execution. Set _RUN_MIGRATIONS=true when you are ready."
        fi

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args:
      - run
      - jobs
      - deploy
      - ${_SERVICE_NAME}-cleanup-reservation-requests
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REPOSITORY}/${_SERVICE_NAME}:$SHORT_SHA
      - --region=${_REGION}
      - --service-account=${_RUNTIME_SERVICE_ACCOUNT}
      - --set-cloudsql-instances=${_CLOUD_SQL_CONNECTION_NAME}
      - --command=python
      - --args=-m,reservation_api.maintenance,cleanup-reservation-requests
      - --set-env-vars=^|^IS_DEV_MODE=${_IS_DEV_MODE}|APP_ENV=${_APP_ENV}|APP_TIMEZONE=${_APP_TIMEZONE}|CLEANUP_GMT+9_HOUR=${_CLEANUP_GMT_9_HOUR}|CLEANUP_GMT_PLUS_9_HOUR=${_CLEANUP_GMT_9_HOUR}
      - --set-secrets=DATABASE_URL=${_DATABASE_URL_SECRET}:latest

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE_NAME}
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REPOSITORY}/${_SERVICE_NAME}:$SHORT_SHA
      - --region=${_REGION}
      - --platform=managed
      - --allow-unauthenticated
      - --service-account=${_RUNTIME_SERVICE_ACCOUNT}
      - --set-cloudsql-instances=${_CLOUD_SQL_CONNECTION_NAME}
      - --set-env-vars=^|^IS_DEV_MODE=${_IS_DEV_MODE}|APP_ENV=${_APP_ENV}|APP_TIMEZONE=${_APP_TIMEZONE}|DISPLAY_TIMEZONE_LABEL=${_DISPLAY_TIMEZONE_LABEL}|OTP_TIMEOUT_SECOND=${_OTP_TIMEOUT_SECOND}|OTP_DELTA=${_OTP_DELTA}|OTP_QR_HASH_ALGORITHM=${_OTP_QR_HASH_ALGORITHM}|OTP_MANUAL_HASH_ALGORITHM=${_OTP_MANUAL_HASH_ALGORITHM}|OTP_MANUAL_CODE_LENGTH=${_OTP_MANUAL_CODE_LENGTH}|OTP_MANUAL_CODE_REGISTRY_BACKEND=${_OTP_MANUAL_CODE_REGISTRY_BACKEND}|OTP_MANUAL_CODE_COLLECTION=${_OTP_MANUAL_CODE_COLLECTION}|OTP_MANUAL_CODE_MAX_ATTEMPTS=${_OTP_MANUAL_CODE_MAX_ATTEMPTS}|FIRESTORE_PROJECT_ID=${_FIRESTORE_PROJECT_ID}|FIRESTORE_DATABASE=${_FIRESTORE_DATABASE}|MESSAGE_BUS_BACKEND=${_MESSAGE_BUS_BACKEND}|VISIT_EVENT_TOPIC=${_VISIT_EVENT_TOPIC}|CORS_ALLOWED_ORIGINS=${_CORS_ALLOWED_ORIGINS}|KAKAO_REDIRECT_URI_ALLOWLIST=${_KAKAO_REDIRECT_URI_ALLOWLIST}|RESERVATION_QUEUE_BACKEND=${_RESERVATION_QUEUE_BACKEND}|CLOUD_TASKS_PROJECT_ID=${_CLOUD_TASKS_PROJECT_ID}|CLOUD_TASKS_LOCATION=${_CLOUD_TASKS_LOCATION}|CLOUD_TASKS_QUEUE=${_CLOUD_TASKS_QUEUE}|RESERVATION_WORKER_URL=${_RESERVATION_WORKER_URL}|CLOUD_TASKS_SERVICE_ACCOUNT_EMAIL=${_CLOUD_TASKS_SERVICE_ACCOUNT_EMAIL}|CLOUD_TASKS_AUDIENCE=${_CLOUD_TASKS_AUDIENCE}|ADMIN_LOGIN_GATEWAY_REQUIRED=${_ADMIN_LOGIN_GATEWAY_REQUIRED}|CLEANUP_GMT+9_HOUR=${_CLEANUP_GMT_9_HOUR}|CLEANUP_GMT_PLUS_9_HOUR=${_CLEANUP_GMT_9_HOUR}
      - --set-secrets=DATABASE_URL=${_DATABASE_URL_SECRET}:latest,SECRET_KEY=${_SECRET_KEY_SECRET}:latest,OTP_SECRET_KEY=${_OTP_SECRET_KEY_SECRET}:latest,ADMIN_ID=${_ADMIN_ID_SECRET}:latest,ADMIN_PASSWORD=${_ADMIN_PASSWORD_SECRET}:latest,KAKAO_REST_API_KEY=${_KAKAO_REST_API_KEY_SECRET}:latest,KAKAO_CLIENT_SECRET=${_KAKAO_CLIENT_SECRET_SECRET}:latest,RESERVATION_GATEWAY_SECRET=${_RESERVATION_GATEWAY_SECRET_SECRET}:latest,RESERVATION_WORKER_SECRET=${_RESERVATION_WORKER_SECRET_SECRET}:latest

images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REPOSITORY}/${_SERVICE_NAME}:$SHORT_SHA
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REPOSITORY}/${_SERVICE_NAME}:latest

serviceAccount: 'projects/reservation-io/serviceAccounts/${_RUNTIME_SERVICE_ACCOUNT}'

options:
  logging: CLOUD_LOGGING_ONLY
